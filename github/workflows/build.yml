name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Create project
        run: |
          mkdir -p /tmp/keep
          cp pubspec.yaml /tmp/keep/pubspec.yaml
          cp lib/main.dart /tmp/keep/main.dart
          rm -rf pubspec.yaml lib
          flutter create --platforms=android,web --org com.osama --project-name assets_market .
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          cp /tmp/keep/main.dart lib/main.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
