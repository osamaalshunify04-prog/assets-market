<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوق الأصول</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f7;color:#111}
header{background:#4f46e5;color:#fff;padding:16px}
input{width:100%;padding:10px;border-radius:8px;border:0;margin-top:8px;box-sizing:border-box}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px}
.chip{padding:8px 14px;background:#fff;border:1px solid #ddd;border-radius:20px;white-space:nowrap;cursor:pointer}
.chip.on{background:#4f46e5;color:#fff}
#list{padding:0 12px 24px;display:grid;gap:10px}
.card{background:#fff;border-radius:12px;padding:14px}
.card h3{margin:0 0 6px}
.price{color:#4f46e5;font-weight:bold}
</style>
</head>
<body>
<header>
  <h2 style="margin:0">🛒 سوق الأصول الرقمية</h2>
  <input id="q" placeholder="ابحث عن قالب أو أيقونات...">
</header>
<div id="cats"></div>
<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient('PROJECT_URL', 'ANON_KEY');
let cat = null, q = '';

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

async function loadCats(){
  const { data } = await db.from('categories').select('*');
  const box = document.getElementById('cats');
  box.innerHTML = '';
  const all = el('div', 'chip on', 'الكل');
  all.onclick = () => pick(null);
  box.append(all);
  (data || []).forEach(c => {
    const chip = el('div', 'chip', c.icon + ' ' + c.name);
    chip.onclick = () => pick(c.id);
    box.append(chip);
  });
}

function pick(id){
  cat = id;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  event.currentTarget.classList.add('on');
  loadAssets();
}

async function loadAssets(){
  let query = db.from('assets').select('*').order('created_at', { ascending: false });
  if (cat) query = query.eq('category_id', cat);
  if (q) query = query.ilike('title', '%' + q + '%');
  const { data, error } = await query;
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (error) { list.append(el('div', 'card', 'خطأ: ' + error.message)); return; }
  if (!data.length) { list.append(el('div', 'card', 'لا توجد نتائج')); return; }
  data.forEach(a => {
    const card = el('div', 'card');
    card.append(el('h3', '', a.title));
    card.append(el('div', '', a.description || ''));
    card.append(el('div', 'price', a.price > 0 ? a.price + '$' : 'مجاني'));
    list.append(card);
  });
}

document.getElementById('q').oninput = e => { q = e.target.value; loadAssets(); };
loadCats();
loadAssets();
</script>
</body>
</html>
